# Prometheus 配置文件
# 用于抓取 Austin 应用的 Micrometer 指标
# 版本兼容：prometheus 3-24.04_stable

global:
  scrape_interval: 5s          # 全局抓取间隔：5 秒
  evaluation_interval: 5s      # 规则评估间隔：5 秒
  scrape_timeout: 4s           # 单次抓取超时：4 秒（必须小于 scrape_interval）

# 告警规则文件（可选，联调阶段暂不配置）
# rule_files:
#   - "alerts/*.yml"

# 告警管理器配置（可选）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:

  # ==================== Prometheus 自监控 ====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ==================== Austin 应用指标 ====================
  - job_name: 'austin'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['austin-web:8080']   # Docker 内部服务名，使用 Docker Compose 网络
        labels:
          application: 'austin'
          env: 'test'
    # 可选：过滤掉不需要的指标，降低存储压力
    # metric_relabel_configs:
    #   - source_labels: [__name__]
    #     regex: 'jvm_gc_pause.*'
    #     action: drop
