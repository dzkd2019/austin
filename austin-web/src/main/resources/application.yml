spring:
  profiles:
    active: test
  application:
    name: austin

  # ==================== Database Configuration ====================
  datasource:
    url: jdbc:mysql://${austin.database.ip:austin-mysql}:${austin.database.port:3306}/austin?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull
    username: ${austin.database.username:root}
    password: ${austin.database.password:root123_A}
    driver-class-name: com.mysql.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      auto-commit: true
      idle-timeout: 30000
      pool-name: HikariCP
      max-lifetime: 900000
      connection-timeout: 10000
      connection-test-query: SELECT 1
      validation-timeout: 1000

  # ==================== Redis Configuration ====================
  data:
    redis:
      host: ${austin.redis.ip:austin-redis}
      port: ${austin.redis.port:6379}
      password: ${austin.redis.password:austin}

  # ==================== Kafka Configuration ====================
  kafka:
    bootstrap-servers: ${austin.kafka.ip:austin-kafka}:${austin.kafka.port:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 生产者调优配置（生产级参数）
      acks: all                      # 等待所有 ISR 副本确认，防止消息丢失
      retries: 3                     # 发送失败时自动重试 3 次
      batch-size: 65536              # 批量发送大小 64KB（默认 16KB），提升吞吐
      buffer-memory: 67108864        # 生产者缓冲区 64MB
      compression-type: snappy       # 压缩类型，降低网络传输开销
      properties:
        linger.ms: 5                              # 等待最多 5ms 以积累更多消息组成批次
        max.in.flight.requests.per.connection: 5  # 启用幂等时最多 5 个并行请求，兼顾顺序与吞吐
        enable.idempotence: true                  # 启用幂等生产，防止重试导致重复消息
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      auto-commit-interval: 1000
      enable-auto-commit: true


  # ==================== Nacos Configuration ====================
  cloud:
    nacos:
      config:
        server-addr: ${austin.nacos.addr.ip:localhost}:${austin.nacos.addr.port:8848}
        username: ${austin.nacos.username:nacos}
        password: ${austin.nacos.password:nacos}
        namespace: ${austin.nacos.namespace:66dd22d5-6845-4c70-8105-f7232c1b4b7c}
        group: ${austin.nacos.group:DEFAULT_GROUP}
  config:
    import:
      - nacos:${austin.nacos.dataId:austin-test.yaml}?refreshEnabled=true
      - nacos:austin-backpressure.json?refreshEnabled=true
      - nacos:austin-handler.yaml?refreshEnabled=true

# ==================== OkHttp Configuration ====================
ok:
  http:
    connect-timeout: 30
    keep-alive-duration: 300
    max-idle-connections: 200
    read-timeout: 30
    write-timeout: 30

# ==================== Management/Monitoring Configuration ====================
management:
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: false
    prometheus:
      enabled: false
  endpoints:
    web:
      exposure:
        include: '*'
  prometheus:
    metrics:
      export:
        enabled: false
  health:
    rabbit:
      enabled: false

# ==================== Server Configuration ====================
server:
  shutdown: graceful

# ==================== Austin Business Configuration ====================
austin:
  business:
    topic:
      name: austinBusiness
    recall:
      topic:
        name: austinRecall
      group:
        name: recallGroupId
    log:
      topic:
        name: austinTraceLog
    tagId:
      key: kafka_tag_id
      value: com.java3y.austin.3y
# ==================== XXL-Job Configuration ====================
xxl:
  job:
    admin:
      addresses: http://${austin.xxl.job.ip:austin-xxl-job}:${austin.xxl.job.port:8080}/xxl-job-admin
      username: ${austin.xxl.job.username:admin}
      password: ${austin.xxl.job.password:123456}
    executor:
      appname: ${austin.xxl.job.executor.appname:austin}
      jobHandlerName: ${austin.xxl.job.executor.jobHandlerName:austinJob}
      address: ${austin.xxl.job.address:}
      ip: ''
      port: ${austin.xxl.executor.port:6666}
      logpath: logs/xxl
      logretentiondays: 30
    accessToken: ${austin.xxl.job.accessToken:default_token}

# ==================== Graylog Configuration ====================
graylog:
  ip: ${austin.graylog:austin-graylog}

