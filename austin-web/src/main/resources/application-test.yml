server:
  port: 8080

# ==================== Message Queue Pipeline ====================
austin:
  mq:
    pipeline: kafka  # choices: [kafka]/[eventBus]/[rocketMq]/[rabbitMq], recommend [eventBus] or [kafka]

  # ==================== XXL-Job Switch ====================
  xxl:
    job:
      enabled: true
      ip: localhost
      port: 9090

  # ==================== Apollo/Nacos Switch ====================
  apollo:
    enabled: false
  nacos:
    enabled: true
    addr:
      ip: localhost
      port: 8848
    namespace: bd604821-8221-4c99-90e7-edd56431839f
    dataId: austin-test

  # ==================== File Upload Configuration ====================
  business:
    upload:
      crowd:
        path: /home/mrawa/code/austin/data/upload/crowd/

  # ==================== Sensitive Words Filter ====================
  senswords:
    filter:
      enabled: true
    dict:
      path: classpath:sensitive-words.txt

  # ==================== Database Configuration ====================
  database:
    ip: localhost
    port: 2026
    username: mrawa
    password: password

  # ==================== Redis Configuration ====================
  redis:
    ip: localhost
    port: 6379

  # ==================== Kafka Configuration ====================
  kafka:
    ip: localhost
    port: 9092

  # ==================== XXL-Job Configuration ====================


  # ==================== Nacos Configuration ====================


